# Football Quiz. Start/update: docker compose up -d
services:
  # The quiz itself (the public copy is GitHub Pages; this is the home copy)
  football-quiz:
    image: nginx:alpine
    container_name: football-quiz
    restart: unless-stopped
    ports:
      - "8097:80"
    volumes:
      - ./docs:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # Leaderboard API. Localhost only; public via `tailscale funnel --https=10000`.
  # Since Phase 6 it's built from server/Dockerfile (python:3.13-alpine + pywebpush):
  #   docker compose build football-quiz-scores && docker compose up -d football-quiz-scores
  football-quiz-scores:
    build: ./server
    image: football-quiz-scores:v2
    container_name: football-quiz-scores
    restart: unless-stopped
    user: "1000:1000"
    command: ["python", "-u", "/app/leaderboard.py"]
    ports:
      - "127.0.0.1:8093:8000"
    volumes:
      - ./server:/app:ro
      - ./data:/data
      - ./docs:/docs:ro   # questions.json, for server-side marking and the daily quiz
      # VAPID keypair for push notifications - outside git, chmod 600 (uid 1000 can read it)
      - /home/riccioserver/keys/football-quiz-vapid.json:/keys/vapid.json:ro
